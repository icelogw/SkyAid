name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build
        env:
          SKYAID_APP_KEY: ${{ secrets.SKYAID_APP_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skyaid
          path: build/libs/*.jar

      # A tag like v0.1.0 becomes a GitHub Release with the jars attached -
      # the mod jar and the sources jar the GPL asks for.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
