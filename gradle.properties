# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Fabric Properties
# Versions verified against FabricMC/fabric-example-mod branch 26.2.
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Fabric API
fabric_api_version=0.157.0+26.2

# Hypixel Mod API - https://github.com/HypixelDev/ModAPI
# Supports Fabric on 26.1-26.2.
hypixel_mod_api_version=1.0.2

# Mod Properties
mod_version=0.1.1
maven_group=dev.skyaid
archives_base_name=skyaid

# Mod Menu - optional integration, provides the settings button in its mod list.
modmenu_version=20.0.1
